name: Build and publish Agent image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project naming and derive image identity
        run: python scripts/check_naming.py --type agent --github-env
      - name: Check Modal adapter syntax
        run: python -m py_compile modal_app.py modal_client.py
      - name: Check committed dependency lock
        run: test -s requirements.lock
      - name: Build amd64 container
        run: |
          docker build --platform linux/amd64 \
            --build-arg "QJAI_PROJECT_NAME=$PROJECT_NAME" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" .
      - name: Verify OCI identity
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' "$IMAGE:sha-$GITHUB_SHA")" = "$PROJECT_NAME"
      - name: Unit tests in built container
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            "$IMAGE:sha-$GITHUB_SHA" python -m unittest discover -s tests -v
      - name: Smoke test without network
        run: |
          docker run --rm --network none \
            -e AGENT_MODE=smoke -e RUN_ID=ci-smoke -e BUSINESS_DATE=2026-01-01 \
            "$IMAGE:sha-$GITHUB_SHA" > smoke.json
          python - <<'PY'
          import json
          with open("smoke.json") as f:
              data = json.load(f)
          assert data["status"] == "succeeded"
          assert data["run_id"] == "ci-smoke"
          assert data["mode"] == "smoke"
          import os
          assert data["agent_name"] == os.environ["PROJECT_NAME"]
          print(data)
          PY
      - name: Benchmark report unit tests
        run: python -m unittest discover -s tests_host -v
      - name: Offline benchmark acceptance
        run: python scripts/benchmark.py --image "$IMAGE:sha-$GITHUB_SHA" --repeats 3 --timeout-seconds 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-benchmark-report
          path: benchmark-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Authenticate and publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
          docker inspect --format='{{json .RepoDigests}}' "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

  verify-public:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Pull anonymously and run published image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --network none -e AGENT_MODE=smoke "$IMAGE"
